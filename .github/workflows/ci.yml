name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Architecture, licenses and Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up reviewed Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0; v7 includes a disallowed bundled license
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Download dependency source for license verification
        run: go mod download all
      - name: Enforce dependency license policy
        run: go run ./tools/checks -only licenses
      - name: Enforce ports and adapters
        run: go run ./tools/checks -only architecture
      - name: Validate pinned specifications
        run: go run ./tools/checks -only specifications
      - name: Require Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Test including policy rejection fixtures
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Prove authorization boundaries against isolated PostgreSQL and OpenBao
        run: go run ./tools/p0
