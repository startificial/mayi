      "deviations": [
        "ES256/P-256 and strict bounded JOSE/claim fields only; header proof and dpop_jkt supported at PAR.",
        "Required one-minute endpoint/key/tenant/purpose nonces; atomic PostgreSQL nonce recheck and replay consume.",
        "Scheme/host/default-port normalization, exact escaped paths, dot-segment rejection; no general URI equivalence or browser interoperability claim.",
